<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>알록달록 꼬마 비행기 모험</title>
    <style>
        body {
            margin: 0;
            background: #87CEEB; /* 하늘색 배경 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            color: #FF4500;
            margin-bottom: 10px;
            text-shadow: 2px 2px #FFF;
        }
        canvas {
            background: linear-gradient(to bottom, #B0E0E6, #4682B4);
            border: 4px solid #FFF;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
            cursor: none; /* 마우스 커서 숨기기 */
        }
        #info {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>✈️ 알록달록 꼬마 비행기의 하늘 여행 🌟</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="info">점수: <span id="score">0</span> 🎈</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let score = 0;

    // 플레이어(귀여운 비행기)
    let player = {
        x: 200,
        y: 500,
        width: 45,
        height: 45,
        color: "#FF6347"
    };

    let bullets = [];
    let enemies = [];
    let particles = [];

    // 마우스 위치로 비행기 이동
    canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left - player.width / 2;
        player.y = e.clientY - rect.top - player.height / 2;
        
        // 화면 밖으로 나가지 않도록 제한
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        if (player.y < 0) player.y = 0;
        if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
    });

    // 자동으로 별 모양 발사체 발사
    setInterval(() => {
        bullets.push({
            x: player.x + player.width / 2 - 5,
            y: player.y,
            width: 10,
            height: 15,
            speed: 7
        });
    }, 300);

    // 귀여운 구름/풍선 적 생성
    setInterval(() => {
        let size = Math.random() * 20 + 30;
        enemies.push({
            x: Math.random() * (canvas.width - size),
            y: -50,
            width: size,
            height: size,
            speed: Math.random() * 1.5 + 1,
            color: ['#FFB6C1', '#FFD700', '#98FB98', '#DDA0DD'][Math.floor(Math.random() * 4)]
        });
    }, 1200);

    // 폭발 효과 (팡파레)
    function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                radius: Math.random() * 5 + 2,
                color: color,
                life: 30
            });
        }
    }

    // 게임 루프
    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 발사체 이동 및 그리기 (반짝이는 별 모양)
        ctx.fillStyle = "#FFD700";
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            
            ctx.beginPath();
            ctx.arc(b.x + b.width/2, b.y + b.height/2, b.width, 0, Math.PI * 2);
            ctx.fill();

            if (b.y < 0) {
                bullets.splice(i, 1);
            }
        }

        // 2. 적(구름/풍선) 이동 및 그리기
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.y += e.speed;

            // 동글동글한 귀여운 적 그리기
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.x + e.width/2, e.y + e.height/2, e.width/2, 0, Math.PI * 2);
            ctx.fill();
            // 눈 추가
            ctx.fillStyle = "#FFF";
            ctx.beginPath();
            ctx.arc(e.x + e.width/3, e.y + e.height/3, 5, 0, Math.PI * 2);
            ctx.arc(e.x + (e.width/3)*2, e.y + e.height/3, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(e.x + e.width/3, e.y + e.height/3, 2, 0, Math.PI * 2);
            ctx.arc(e.x + (e.width/3)*2, e.y + e.height/3, 2, 0, Math.PI * 2);
            ctx.fill();

            // 화면 아래로 나가면 제거
            if (e.y > canvas.height) {
                enemies.splice(i, 1);
                continue;
            }

            // 총알과 충돌 체크
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (
                    b.x < e.x + e.width &&
                    b.x + b.width > e.x &&
                    b.y < e.y + e.height &&
                    b.y + b.height > e.y
                ) {
                    createParticles(e.x + e.width/2, e.y + e.height/2, e.color);
                    enemies.splice(i, 1);
                    bullets.splice(j, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    break;
                }
            }
        }

        // 3. 파티클(폭발 효과) 업데이트
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        // 4. 플레이어(비행기) 그리기
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x + 15, player.y, 15, 40); // 동체
        ctx.fillRect(player.x, player.y + 15, 45, 10); // 날개
        
        // 조종사 얼굴
        ctx.fillStyle = "#FFE4C4";
        ctx.beginPath();
        ctx.arc(player.x + player.width/2, player.y + 15, 8, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(update);
    }

    update();
</script>

</body>
</html>
